<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="A playable browser recreation of Chrono Trigger's opening chapter — the Millennial Fair. Keyboard and touch controls.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Chrono Trigger — Chapter 1: The Millennial Fair</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23081040'/><circle cx='8' cy='8' r='5' fill='none' stroke='%2360d8f8' stroke-width='2'/></svg>">
</head>
<body>
  <div id="screen">
    <canvas id="game"></canvas>
    <div id="topbar">
      <button id="btn-sound" title="Sound on/off" aria-label="Toggle sound">♪</button>
      <button id="btn-full" title="Fullscreen" aria-label="Fullscreen">⛶</button>
    </div>
  </div>

  <div id="controls">
    <div id="dpad" aria-label="D-pad">
      <div class="dp-bg"></div>
      <span class="arw up">▲</span><span class="arw down">▼</span>
      <span class="arw left">◀</span><span class="arw right">▶</span>
    </div>
    <div id="btns">
      <button id="btn-menu" class="small" aria-label="Status menu">MENU</button>
      <div class="ab">
        <button id="btn-b" class="round b" aria-label="Run / Cancel">B</button>
        <button id="btn-a" class="round a" aria-label="Talk / Confirm">A</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { boot } from './js/game.js';
    if (matchMedia('(hover: none), (pointer: coarse)').matches || 'ontouchstart' in window) {
      document.body.classList.add('touch');
    }
    boot();
  </script>
</body>
</html>
